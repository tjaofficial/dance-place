{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}The Dance Place LTD | Waterford, Michigan{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}The Dance Place LTD offers recreational and accelerated dance education in Waterford, Michigan for dancers of all ages and experience levels.{% endblock %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/global.css' %}">
    <link rel="stylesheet" href="{% static 'css/header.css' %}">
    <link rel="stylesheet" href="{% static 'css/home.css' %}">
    <link rel="stylesheet" href="{% static 'css/pages.css' %}">
    <link rel="stylesheet" href="{% static 'css/footer.css' %}">
    <script src="{% static 'js/header.js' %}" defer></script>
    <script src="{% static 'js/home.js' %}" defer></script>
    <script src="{% static 'js/pages.js' %}" defer></script>
</head>
<body class="{% block body_class %}{% endblock %}">
    {% include "website/includes/header.html" %}
    <main>
        {% block content %}{% endblock %}
    </main>
    {% include "website/includes/footer.html" %}
</body>
</html>
